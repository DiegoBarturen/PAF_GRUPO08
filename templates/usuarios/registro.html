{% extends 'base.html' %}

{% block title %}Registro | Delivery NATIVO{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-md-6 col-sm-10">
        <div class="card shadow-lg border-0 rounded-4" style="border-radius: 24px !important; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06) !important;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-danger bg-opacity-10 text-danger rounded-4 d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px; border-radius: 20px !important;">
                        <i class="fas fa-user-plus fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Crea tu cuenta</h3>
                    <p class="text-muted small">Únete a la mejor plataforma de delivery local</p>
                </div>
                
                <form method="POST" class="d-grid gap-3">
                    {% csrf_token %}
                    
                    <div>
                        <label class="form-label fw-bold small text-muted text-uppercase mb-2">Nombre de Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Ej: diego_dev" required>
                        </div>
                    </div>
                    
                    <div>
                        <label class="form-label fw-bold small text-muted text-uppercase mb-2">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-envelope text-muted"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="correo@ejemplo.com" required>
                        </div>
                    </div>
                    
                    <div>
                        <label class="form-label fw-bold small text-muted text-uppercase mb-2">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Crea una contraseña segura" required>
                        </div>
                    </div>

                    <div>
                        <label class="form-label fw-bold small text-muted text-uppercase mb-2">¿Cómo deseas usar la plataforma?</label>
                        <select name="rol" class="form-select border-0 bg-light fw-semibold text-dark" required style="padding: 0.75rem 1rem !important;">
                            <option value="" disabled selected>Selecciona una opción...</option>
                            <option value="cliente">🍔 Quiero pedir comida (Cliente)</option>
                            <option value="negocio">🏪 Tengo un restaurante (Negocio)</option>
                            <option value="repartidor">🛵 Quiero hacer entregas (Repartidor)</option>
                        </select>
                        <div class="form-text text-muted small mt-1">Esto definirá tu panel de control y opciones operativas.</div>
                    </div>
                    
                    <div class="d-grid mt-3">
                        <button type="submit" class="btn btn-danger btn-lg fw-bold rounded-pill py-2.5 shadow-sm">Registrarme</button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-0 text-muted small">¿Ya tienes una cuenta? <a href="{% url 'login' %}" class="text-danger fw-bold text-decoration-none">Inicia sesión</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
