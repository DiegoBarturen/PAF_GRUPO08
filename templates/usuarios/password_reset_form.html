{% extends 'base.html' %}

{% block title %}Nueva Contraseña | Delivery NATIVO{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <h3 class="fw-bold">Ingresa tu nueva contraseña</h3>
                <p class="text-muted">Por favor, ingresa tu nueva contraseña dos veces para verificarla.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-danger fw-bold w-100">Cambiar Contraseña</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
