{% extends 'base.html' %}

{% block title %}Iniciar Sesión | Delivery NATIVO{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5 mb-5">
    <div class="col-md-5 col-sm-8">
        <div class="card shadow-lg border-0 rounded-4" style="border-radius: 24px !important; box-shadow: 0 20px 50px rgba(15, 23, 42, 0.06) !important;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="bg-danger bg-opacity-10 text-danger rounded-4 d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px; border-radius: 20px !important;">
                        <i class="fas fa-motorcycle fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Bienvenido de vuelta</h3>
                    <p class="text-muted small">Ingresa tus datos para continuar en Delivery NATIVO</p>
                </div>
                
                <form method="POST" class="d-grid gap-3">
                    {% csrf_token %}
                    <div>
                        <label class="form-label fw-bold small text-muted text-uppercase mb-2">Nombre de Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" required>
                        </div>
                    </div>
                    
                    <div>
                        <label class="form-label fw-bold small text-muted text-uppercase mb-2">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="text-end">
                        <a href="{% url 'reset_password' %}" class="text-decoration-none small text-danger fw-bold">¿Olvidaste tu contraseña?</a>
                    </div>
                    
                    <div class="d-grid mt-2">
                        <button type="submit" class="btn btn-danger btn-lg fw-bold rounded-pill py-2.5 shadow-sm">Iniciar Sesión</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="mb-0 text-muted small">¿No tienes cuenta? <a href="{% url 'registro' %}" class="text-danger fw-bold text-decoration-none">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
