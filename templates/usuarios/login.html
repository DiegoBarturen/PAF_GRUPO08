{% extends 'base.html' %}

{% block title %}Iniciar Sesión | Delivery NATIVO{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-sm-8">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-motorcycle fa-3x text-danger mb-3"></i>
                    <h3 class="fw-bold">Bienvenido de vuelta</h3>
                    <p class="text-muted">Ingresa tus datos para continuar</p>
                </div>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-user"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Ingresa tu usuario" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fas fa-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-danger btn-lg fw-bold">Iniciar Sesión</button>
                    </div>
                </form>
                
                <div class="text-center mt-4">
                    <p class="mb-0">¿No tienes cuenta? <a href="#" class="text-danger fw-bold text-decoration-none">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
