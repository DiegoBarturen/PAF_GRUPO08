{% extends 'base.html' %}

{% block title %}Recuperar Contraseña | Delivery NATIVO{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 text-center">
                <i class="fas fa-key fa-3x text-warning mb-3"></i>
                <h3 class="fw-bold">¿Olvidaste tu contraseña?</h3>
                <p class="text-muted">Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-warning fw-bold w-100">Enviar enlace</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
