{% extends 'base.html' %}

{% block title %}Mi Perfil | Delivery NATIVO{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-7">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 fw-bold text-danger"><i class="fas fa-user-edit me-2"></i>Gestionar Perfil</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Usuario</label>
                            <input type="text" class="form-control bg-light" value="{{ user.username }}" readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Rol del Sistema</label>
                            <input type="text" class="form-control bg-light" value="{{ user.get_rol_display }}" readonly>
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Teléfono de Contacto</label>
                            <input type="text" name="telefono" class="form-control" value="{{ user.telefono|default:'' }}" placeholder="999 999 999">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label fw-bold">Dirección Principal</label>
                            <textarea name="direccion" class="form-control" rows="2">{{ user.direccion|default:'' }}</textarea>
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-danger fw-bold">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
