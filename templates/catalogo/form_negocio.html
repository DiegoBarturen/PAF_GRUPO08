{% extends 'base.html' %}
{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow-sm border-0 p-4 bg-white">
        <h3 class="fw-bold mb-4 text-dark">
            {% if existe %}
                <i class="fas fa-store-edit text-danger me-2"></i>Editar Datos de Mi Establecimiento
            {% else %}
                <i class="fas fa-shop text-success me-2"></i>Registrar Nuevo Negocio Local
            {% endif %}
        </h3>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="d-flex gap-2 mt-4">
                <a href="{% url 'pedidos:panel_negocio' %}" class="btn btn-outline-secondary fw-bold w-50">
                    <i class="bi bi-arrow-left"></i> Volver al Panel
                </a>
                <button type="submit" class="btn {% if existe %}btn-danger{% else %}btn-success{% endif %} fw-bold w-50">
                    {% if existe %}Actualizar Datos{% else %}Guardar Negocio{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
