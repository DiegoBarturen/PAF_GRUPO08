{% extends 'base.html' %}
{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <div class="card shadow-sm border-0 p-4 bg-white">
        <h3 class="fw-bold mb-4 text-dark">Formulario de Producto</h3>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            
            <div class="d-flex gap-2 mt-4">
                <a href="{% url 'administrar_productos' %}" class="btn btn-outline-secondary fw-bold w-50">
                    <i class="bi bi-arrow-left"></i> Cancelar / Volver
                </a>
                <button type="submit" class="btn btn-primary fw-bold w-50">Guardar Cambios</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
